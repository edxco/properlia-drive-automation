<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --ok:#1e7d4f; --bad:#b3261e; --test:#a15c00; --border:#e3e3df; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#21211f; --text:#ececea; --muted:#a3a39e; --ok:#5cc18e; --bad:#f2827a; --test:#f0b257; --border:#3a3a37; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); max-width:760px; margin-inline:auto; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  h1 { margin:0; font-size:24px; }
  h2 { margin:0 0 12px; font-size:17px; }
  .badge { border:1px solid var(--test); color:var(--test); border-radius:999px; padding:2px 10px; font-weight:600; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:0 0 12px; }
  dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--text); color:var(--bg); cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; } .muted { color:var(--muted); }
  ol { padding-left:20px; } li { margin:4px 0; } a { color:inherit; }
</style>
